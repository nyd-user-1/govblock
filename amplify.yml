version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            # Aurora Serverless v2 pauses at 0 ACU after five idle minutes, and a
            # build's first minute of prerenders against a paused cluster hangs
            # and then 500s (job 193, 2026-09-03). Knock first, so the resume
            # overlaps the install; then, before building, wait until it answers.
            - |
              aws rds-data execute-statement --resource-arn "$POLICY_CLUSTER_ARN" --secret-arn "$POLICY_SECRET_ARN" \
                --database "${POLICY_DATABASE:-policy}" --sql "select 1" > /dev/null 2>&1 || echo "database: waking"
            - corepack enable
            - corepack prepare pnpm@10.33.4 --activate
            # The workspace root owns the lockfile; -C keeps the shell in appRoot,
            # which is where Amplify expects to find .next afterwards.
            - pnpm -C ../.. install --frozen-lockfile
            - |
              for i in $(seq 1 36); do
                if aws rds-data execute-statement --resource-arn "$POLICY_CLUSTER_ARN" --secret-arn "$POLICY_SECRET_ARN" \
                     --database "${POLICY_DATABASE:-policy}" --sql "select count(*) from \"Committees\"" > /dev/null 2>&1; then
                  echo "database: awake after $((i*5))s"; break
                fi
                sleep 5
              done
        build:
          commands:
            # Amplify gives these to the build, and Next 16 (Turbopack) does not
            # inline `env` into the server bundle, so hand them to the runtime as
            # a real .env.production rather than committing ARNs to a public repo.
            - |
              printf 'POLICY_CLUSTER_ARN=%s\nPOLICY_SECRET_ARN=%s\nPOLICY_DATABASE=%s\n' \
                "$POLICY_CLUSTER_ARN" "$POLICY_SECRET_ARN" "${POLICY_DATABASE:-policy}" > .env.production
            # Sign-in (lane AUTH). Each line is written only when Amplify
            # actually holds the value: an empty AUTH_SECRET or AUTH_GOOGLE_ID
            # would leave Auth.js half-configured, whereas an ABSENT one makes
            # `signInConfigured` false and /auth explains itself. Missing is a
            # state this app renders; blank is one it does not.
            - |
              for name in AUTH_SECRET AUTH_URL AUTH_GOOGLE_ID AUTH_GOOGLE_SECRET; do
                eval "value=\${$name:-}"
                if [ -n "$value" ]; then printf '%s=%s\n' "$name" "$value" >> .env.production; fi
              done
              # Names only — the values are Brendan's Google client and the
              # session secret, and a public build log is not their home.
              echo "sign-in env present: $(grep -c '^AUTH_' .env.production) of 4"
            # The committee video card's YouTube key, same rule: written only
            # when Amplify holds it, so an absent key makes the card say the key
            # is not configured rather than fail a lookup with a blank one.
            #
            # This list is the whole runtime environment. Adding a variable in
            # the Amplify console and not here is a NO-OP at runtime — it
            # reaches the build and stops. That is how the key sat in the branch
            # env for a whole deploy while the card kept saying it was missing.
            - |
              if [ -n "${YOUTUBE_API_KEY:-}" ]; then
                printf 'YOUTUBE_API_KEY=%s\n' "$YOUTUBE_API_KEY" >> .env.production
                echo "youtube key: present"
              else
                echo "youtube key: absent"
              fi
            - pnpm -C ../.. exec turbo build --filter=web
            # Amplify packages <appRoot>/node_modules; prove next resolves there.
            - node -e "console.log('next at', require.resolve('next/package.json'))"
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - ../../node_modules/**/*
          - .next/cache/**/*
