 {g:'Ranked-choice contests',id:'alaska',kind:'rcv'},{g:'Ranked-choice contests',id:'burlington',kind:'rcv'},{g:'Ranked-choice contests',id:'maine',kind:'rcv'},{g:'Ranked-choice contests',id:'nyc',kind:'rcv',remote:true,title:'New York City Mayor, Democratic primary, 2025'},
 ...D.toptwo.map((r,i)=>({g:'Primaries, pooled as top-two',id:'tt'+i,kind:'toptwo',race:r})),
];
const state={subject:SUBJECTS[0],rule:{kind:'held',swing:0},plain:true,removed:new Set(),pool:'run',selected:null,prevRows:null};
const FLAGS='../../../apps/web/public/flags/';const flagOf=s=>s.kind==='chamber'?s.st:s.kind==='rcv'?(s.remote?'NY':D.rcv[s.id].state):s.race.state;const flag=st=>`<img src="${FLAGS}${st}.png" width="20" height="13" alt="" style="border-radius:2px;object-fit:cover;margin-right:9px;vertical-align:-1px;box-shadow:0 0 0 1px rgba(0,0,0,.08)">`;
const stage=$('#stage'),reading=$('#reading'),lever=$('#lever'),sentence=$('#sentence');
function chamberRow(s){return D.chambers.find(r=>r.state===s.st&&r.office===s.office&&r.year===s.year);}
function subjectLabel(s){if(s.kind==='chamber')return S.subjectName(s.st,s.office,s.year);if(s.kind==='rcv')return s.remote?s.title:D.rcv[s.id].title;return S.raceName(s.race);}
function short(s){return s.st==='US'?'House':S.chamberName(s.st,s.office);}

function choose(s,preset={}){state.subject=s;state.rule=preset.rule||{kind:'held',swing:0};state.removed=new Set(preset.removed||[]);state.pool=preset.pool||'run';state.plain=preset.plain!==undefined?preset.plain:!preset.rule;state.selected=null;state.prevRows=null;$('#subject').innerHTML=flag(flagOf(s))+subjectLabel(s);render();}

/* renderers */
function render(){const s=state.subject;$('#subnote').textContent='';if(s.kind==='chamber')renderChamber();else if(s.kind==='rcv')renderRcv();else renderTopTwo();}
function renderChamber(){stage.classList.remove('wide');const s=state.subject,row=chamberRow(s),res=D.results[s.id];const prim=D.primaries[s.id]?S.primaryIndex(D.primaries[s.id]):null;const fun=prim&&D.funnel[s.id];const subject={st:s.st,short:short(s),long:s.st==='US'?'House of Representatives':S.STATE[s.st]+' '+S.chamberName(s.st,s.office)};
 const seatsBase=res?S.seatsFrom(res):Array.from({length:row.seats_up},(_,i)=>({id:'seat'+i,key:'',post:null,party:i<row.dem_seats?'D':i<row.dem_seats+row.rep_seats?'R':'I',share:null,contested:true,margin:null,tier:'live',winner:'',candidates:[]}));
 $('#subnote').textContent=res?'':'District results not published for this chamber yet, so seats are counted, not placed.';
 lever.innerHTML=`<div style="display:flex;flex-direction:column;gap:10px;width:100%"><div class="seg" id="rules"><button data-k="all">All</button><button data-k="held">Closed</button><button data-k="top2" ${prim?'':'disabled'}>Open (T2)</button><button data-k="top4" ${prim?'':'disabled'}>Open (T4)</button></div>${prim?'':`<p class="note" style="margin:0">Open-primary rules need this chamber’s primaries, which are not loaded for ${s.year}.</p>`}</div>`;
 lever.querySelectorAll('#rules button').forEach(b=>b.onclick=()=>{state.plain=b.dataset.k==='all';state.rule={kind:b.dataset.k==='all'?'held':b.dataset.k,swing:0};sync();paint();});
 stage.innerHTML=`<div id="ring"></div><div class="tallies" id="tallies"><span class="n d" id="tD"></span><div class="slot"><div class="legend" id="legend"></div></div><span class="n r" id="tR"></span></div>`;
 function sync(){lever.querySelectorAll('#rules button').forEach(b=>b.setAttribute('aria-pressed',state.plain?b.dataset.k==='all':b.dataset.k===state.rule.kind));}
 function paint(){const rule=state.plain?{kind:'all',swing:0}:state.rule;const seats=S.simulate(seatsBase,rule,row,prim);sentence.innerHTML=S.chamberSentence(subject,seats,rule,row,fun);
  const r=S.hemicycle($('#ring'),seats,{size:s.st==='US'?940:860,plain:state.plain,selected:state.selected,onHover:(seat,e)=>{if(!seat)return S.tip(null);S.tip(`<b>${seatName(seat)}</b><br>${seat.tier==='nobody'?seat.winner+' · no opponent':seat.winner+' ('+seat.party+') by '+seat.margin+' pts'}${seat.moved?`<br><span class="m">November: ${seat.matchup.join(' v. ')}</span>`:''}`,e);},onSelect:seat=>{state.selected=state.selected===seat.id?null:seat.id;paint();}});
  $('#tD').textContent=r.tally.D;$('#tR').textContent=r.tally.R;$('#tallies').style.width=r.size+'px';
  const changed=seats.filter(x=>x.moved);
  $('#legend').innerHTML=`<span><i class="d"></i><i class="r"></i>General</span><span><i class="d pale"></i><i class="r pale"></i>Primary</span>`;
  const sel=state.selected&&seats.find(x=>x.id===state.selected);
  reading.innerHTML=`<div style="flex:1 1 320px;max-width:720px">${sel?S.seatCard(sel,subject,rule):changed.length?`<h3>Seats moved to November · ${changed.length}</h3><div style="display:flex;flex-wrap:wrap;gap:6px">${changed.slice(0,48).map(x=>`<button class="chip" data-sel="${x.id}"><i style="background:${S.PARTY[x.now]}"></i>${seatShort(x)} <span style="color:#737373">${x.matchup.map(m=>/\((\w+)\)$/.exec(m)?.[1]||'').join('·')}</span></button>`).join('')}${changed.length>48?`<span class="note">+${changed.length-48} more</span>`:''}</div>`:''}</div>`;
  reading.querySelectorAll('[data-sel]').forEach(b=>b.onclick=()=>{state.selected=b.dataset.sel;paint();});}
 function seatName(seat){return s.st==='US'?(seat.key.endsWith('-0')?S.STATE[seat.key.slice(0,2)]+' at large':seat.key):'District '+seat.key+(seat.post?' seat '+seat.post:'');}
 function seatShort(seat){return s.st==='US'?(seat.key.endsWith('-0')?seat.key.slice(0,2)+' at large':seat.key):seat.key+(seat.post?'·'+seat.post:'');}
 sync();paint();}
let rcvCache={};
async function renderRcv(){stage.classList.add('wide');const s=state.subject;let data=D.rcv[s.id];if(!data){if(rcvCache[s.id])data=rcvCache[s.id];else{stage.innerHTML='<p class="loading">Reading 1,041,000 ballots…</p>';lever.innerHTML='';reading.innerHTML='';sentence.textContent='';try{data=rcvCache[s.id]=await (await fetch(D.nyc)).json();}catch(e){stage.innerHTML='<p class="note">The ballots could not be read.</p>';return;}}}
 const n=data.candidates.length;const cols=S.candColors(data);const wins=S.h2h(n,data.profiles);
 $('#subnote').textContent=`${S.fmt(data.ballots)} ballots · up to ${data.ranks} rankings`;
 const paint=()=>{const r=S.rcvRounds(stage,data,state.removed,{W:1180,colors:cols,onHover:S.tip});sentence.innerHTML=S.rcvSentence(data,r.count,wins,state.removed);
  lever.innerHTML=`<div id="cands" style="display:flex;flex-wrap:wrap;gap:6px">${[...Array(n).keys()].sort((a,b)=>(r.count.rounds[0].votes[b]??-1)-(r.count.rounds[0].votes[a]??-1)).map(i=>`<button class="chip" data-i="${i}" aria-pressed="${!state.removed.has(i)}" title="${state.removed.has(i)?'Put back':'Take out'}"><i style="background:${cols[i]};color:${cols[i]}"></i>${S.person(data.candidates[i])}</button>`).join('')}</div>${state.removed.size?'<button class="seg" id="reset"><span style="border:1px solid var(--hair);border-radius:999px;padding:6px 12px;font-size:13px">Everyone back</span></button>':''}`;
  lever.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;state.removed.has(i)?state.removed.delete(i):state.removed.add(i);paint();});const rs=$('#reset');if(rs)rs.onclick=()=>{state.removed=new Set();paint();};
  const c=S.condorcet(wins,state.removed);const last=r.count.rounds[r.count.rounds.length-1];
  reading.innerHTML=`<div style="flex:1 1 100%;max-width:none"><h3>One on one</h3><p style="margin:0 0 12px">${c>=0?`<b>${S.person(data.candidates[c])}</b> beats every other candidate one on one${r.count.winner>=0&&c!==r.count.winner?', and still loses the count':''}.`:'No candidate beats every other one on one.'}</p>${S.h2hTable(data,wins,state.removed,cols)}</div>`;};
 paint();}
function renderTopTwo(){stage.classList.remove('wide');const s=state.subject,race=s.race;$('#subnote').textContent=race.system==='party primaries'?(race.complete?'every nominee\'s primary counted':''):'';
 const can=race.system==='party primaries'&&race.complete;
 lever.innerHTML=`<div class="seg" id="pool"><button data-p="run">Two primaries, as run</button><button data-p="two" ${can?'':'disabled'}>One primary, top two advance</button><button data-p="four" ${can?'':'disabled'}>One primary, top four advance</button></div>`;
 lever.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{state.pool=b.dataset.p;paintTT();});
 function paintTT(){lever.querySelectorAll('[data-p]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.p===state.pool));sentence.innerHTML=S.topTwoSentence(race,state.pool);stage.innerHTML='<div id="tt" style="max-width:720px"></div>';state.prevRows=S.topTwo($('#tt'),race,state.pool,{prev:state.prevRows});
  const by=new Map(race.candidates.map(c=>[c.name,c]));const adv=can?S.advancing(race,state.pool):race.general_two;
  reading.innerHTML=`<div><h3>November${state.pool==='four'?', counted by ranked choice':''}</h3><div style="display:flex;flex-direction:column;gap:8px">${adv.map(nm=>{const c=by.get(nm);const won=nm===race.general_winner;return`<div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px"><span><i style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${S.PARTY[S.norm(c.party)]};margin-right:8px"></i>${S.person(nm)} <span style="color:#737373">(${c.party})</span></span><span class="num" style="color:${won?'var(--ink)':'#737373'};font-weight:${won?600:400}">${state.pool==='run'&&c.general!=null?S.fmt(c.general):'—'}</span></div>`;}).join('')}</div>${state.pool==='four'?`<p class="note" style="margin-top:10px">Nobody ranked these candidates, so there is no count to run. The general vote shown under “as run” is the real one.</p>`:state.pool==='two'&&race.differs?`<p class="note" style="margin-top:10px">The general vote is the real one; a changed November has no count to show.</p>`:''}</div>`;}
 paintTT();}

/* cases */
const CASES=[
 {t:'288 of 435 House seats were settled before November',p:'U.S. House 2022 · press Closed, then open the primaries',s:'US|US HOUSE|2022',preset:{rule:{kind:'held',swing:0},plain:false}},
 {t:'Begich beat everyone one on one. He finished third.',p:'Alaska special election 2022 · take Palin out',s:'alaska',preset:{}},
 {t:'64 of 99 Wisconsin Assembly seats were settled before November',p:'Wisconsin Assembly 2024 · 16 had no opponent at all',s:'WI|STATE HOUSE|2024',preset:{rule:{kind:'held',swing:0},plain:false}},
 {t:'Two Democrats would have met in November',p:'Texas 28th, 2022 · pool the primaries',s:'tt0',preset:{pool:'two'}},
 {t:'Kiss won. Montroll beat him one on one.',p:'Burlington mayor 2009 · the classic case',s:'burlington',preset:{}},
];
$('#caselist').innerHTML=CASES.map((c,i)=>`<li><button data-c="${i}"><span>${flag(flagOf(SUBJECTS.find(x=>x.id===c.s)))}</span><h4>${c.t}</h4><p>${c.p}</p></button></li>`).join('');
$('#caselist').querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const c=CASES[+b.dataset.c];choose(SUBJECTS.find(s=>s.id===c.s),c.preset);window.scrollTo({top:0,behavior:'smooth'});});

/* tour */
function startTour(){choose(SUBJECTS[0]);S.tour([
 {el:'#sentence',text:'Every view opens on a claim, then lets you test it. This one: the House looks like 435 seats decided by voters in November.',pad:10},
 {el:'#stage',text:'One dot per seat, blue from the left and red from the right, the closest races at the seam. All 435 filled in: the House as it looks.',pad:16},
 {el:'#lever',text:'Press Closed. Most seats fade: 288 were settled before November, in a closed party primary that 19.8 million people voted in. That is the claim being tested.',pad:12},
 {el:'#lever',text:'Now open the primaries. Top two advancing moves 60 settled seats to November, where all voters choose between two candidates of one party. Top four moves 132.',pad:12},
 {el:'#tallies',text:'Solid seats were decided in the general election. Pale seats were settled in the primary. Click any seat for its race and, under an open rule, its November ballot.',pad:12},
 {el:'#cases',text:'Each case is a claim of its own, opened already set up: a ranked-choice count where the head-to-head winner lost, a primary that would have sent two Democrats to November.',pad:12},
],()=>{});}
$('#help').onclick=startTour;$('#next').onclick=()=>{const i=CASES.findIndex(c=>c.s===state.subject.id);const c=CASES[(i+1)%CASES.length];choose(SUBJECTS.find(x=>x.id===c.s),c.preset);window.scrollTo({top:0,behavior:'smooth'});};
choose(SUBJECTS[0]);
if(!localStorage.getItem('sim-tour')){localStorage.setItem('sim-tour','1');setTimeout(startTour,600);}
})();
</script></body></html>
